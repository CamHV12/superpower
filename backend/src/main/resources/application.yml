spring:
  application:
    name: enterprise-dashboard

  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_dashboard
    username: postgres
    password: Abcd1234

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-version: 0
    baseline-on-migrate: true

server:
  port: 8080


app:
  frontend-url: http://localhost:5173
  jwt:
    secret: mySecretKey123456789012345678901234567890
    expiration-seconds: 3600


springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/swagger-ui
